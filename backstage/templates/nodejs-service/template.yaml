apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: nodejs-service-template
  title: Node.js Service with PostgreSQL
  description: Create a Node.js service, deploy it to EKS, and provision a Crossplane-managed PostgreSQL database.

spec:
  owner: user:guest
  type: service

  parameters:
    - title: Service Details
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Project Name
          type: string
          description: Unique name for your service
          maxLength: 40
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          ui:field: EntityNamePicker
          ui:autofocus: true

        description:
          title: Description
          type: string
          description: Briefly describe what this service does.

        owner:
          title: Owner
          type: string
          description: Backstage user or group responsible for this service.
          default: user:guest

    - title: GitHub Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          description: Choose the GitHub owner configured by Terraform so the deployment role can trust this repository.
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

    - title: AWS Deployment
      required:
        - clusterName
        - awsAccountId
        - githubOwner
        - githubOidcProviderArn
        - ecrRepositoryPrefix
      properties:
        clusterName:
          title: EKS Cluster Name
          type: string
          description: Terraform output cluster_name for the target environment.
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"

        awsAccountId:
          title: AWS Account ID
          type: string
          description: Terraform output aws_account_id.
          pattern: "^[0-9]{12}$"

        githubOwner:
          title: GitHub Owner
          type: string
          description: Terraform output github_owner; the repository must belong to this user or organization.
          pattern: "^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$"

        githubOidcProviderArn:
          title: GitHub OIDC Provider ARN
          type: string
          description: Terraform output github_actions_oidc_provider_arn.
          pattern: "^arn:aws:iam::[0-9]{12}:oidc-provider/token\\.actions\\.githubusercontent\\.com$"

        ecrRepositoryPrefix:
          title: ECR Repository Prefix
          type: string
          description: Terraform output ecr_repository_prefix; the workflow creates one immutable ECR repository per service.
          pattern: "^[a-z0-9][a-z0-9._-]*$"

    - title: PostgreSQL Database
      required:
        - region
        - dbInstanceClass
        - dbName
        - dbSubnetGroupName
        - vpcSecurityGroupIds
      properties:
        region:
          title: AWS Region
          type: string
          description: AWS region where the EKS cluster, ECR repositories, and database are provisioned.
          default: ap-south-1
          pattern: "^[a-z]{2}(-[a-z]+)+-[0-9]+$"

        dbInstanceClass:
          title: RDS Instance Class
          type: string
          description: Choose an instance class supported in the selected region.
          default: db.t4g.micro
          enum:
            - db.t4g.micro
            - db.t3.micro
            - db.t4g.small

        dbName:
          title: Database Name
          type: string
          description: Initial PostgreSQL database name.
          default: app
          maxLength: 63
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"

        dbSubnetGroupName:
          title: RDS Subnet Group
          type: string
          description: Terraform output database_subnet_group_name for the selected AWS region.
          pattern: "^[a-z0-9][a-z0-9-]*$"

        vpcSecurityGroupIds:
          title: VPC Security Group IDs
          type: array
          description: Terraform output database_security_group_id; it permits PostgreSQL from the EKS application security group.
          minItems: 1
          items:
            type: string
            pattern: "^sg-[0-9a-f]{8,17}$"

  steps:
    - id: fetch-base
      name: Generate Project Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutRender:
          - .github/workflows/ci.yml
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          namespace: ${{ parameters.name }}
          region: ${{ parameters.region }}
          clusterName: ${{ parameters.clusterName }}
          awsAccountId: ${{ parameters.awsAccountId }}
          githubOwner: ${{ parameters.githubOwner }}
          ecrRepositoryPrefix: ${{ parameters.ecrRepositoryPrefix }}
          dbInstanceClass: ${{ parameters.dbInstanceClass }}
          dbName: ${{ parameters.dbName }}
          dbSubnetGroupName: ${{ parameters.dbSubnetGroupName }}
          vpcSecurityGroupIds: ${{ parameters.vpcSecurityGroupIds }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: provision-database
      name: Provision EKS access and PostgreSQL with Crossplane
      action: crossplane:provision-rds
      input:
        manifestPath: infra/rds-instance.yaml
        namespace: ${{ parameters.name }}
        passwordSecretName: ${{ parameters.name }}-db-credentials
        instanceName: ${{ parameters.name }}-db
        connectionSecretName: ${{ parameters.name }}-db-connection
        awsAccountId: ${{ parameters.awsAccountId }}
        region: ${{ parameters.region }}
        clusterName: ${{ parameters.clusterName }}
        githubOwner: ${{ parameters.githubOwner }}
        githubOidcProviderArn: ${{ parameters.githubOidcProviderArn }}
        ecrRepositoryPrefix: ${{ parameters.ecrRepositoryPrefix }}
        repoUrl: ${{ steps['publish'].output.remoteUrl }}

    - id: register
      name: Register in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: GitHub Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Backstage Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: Crossplane Database Manifest
        url: ${{ steps['publish'].output.remoteUrl }}/blob/main/infra/rds-instance.yaml
      - title: GitHub Actions Deployment Workflow
        url: ${{ steps['publish'].output.remoteUrl }}/blob/main/.github/workflows/ci.yml
