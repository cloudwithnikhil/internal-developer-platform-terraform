name: Node.js CI

on:
  push:
    branches:
      - "**"
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Build Docker image
        run: docker build -t nodejs-service:ci .
