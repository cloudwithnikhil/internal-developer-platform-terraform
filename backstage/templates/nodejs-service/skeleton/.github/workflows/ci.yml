name: Node.js CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: node-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Build Docker image
        run: docker build -t nodejs-service:ci .

  deploy-to-eks:
    name: Deploy to EKS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: [self-hosted, eks-deployer]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Load deployment configuration
        shell: bash
        run: |
          aws_region="$(jq -r '.awsRegion' infra/deployment-config.json)"
          aws_account_id="$(jq -r '.awsAccountId' infra/deployment-config.json)"
          eks_cluster_name="$(jq -r '.clusterName' infra/deployment-config.json)"
          ecr_repository_prefix="$(jq -r '.ecrRepositoryPrefix' infra/deployment-config.json)"
          service_name="$(jq -r '.serviceName' infra/deployment-config.json)"
          namespace="$(jq -r '.namespace' infra/deployment-config.json)"
          repository_slug="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          configured_owner="$(jq -r '.githubOwner' infra/deployment-config.json | tr '[:upper:]' '[:lower:]')"
          if [ "$configured_owner" != "${repository_slug%%/*}" ]; then
            echo "::error::This repository owner does not match the Terraform-configured GitHub owner."
            exit 1
          fi
          role_hash="$(printf '%s' "${eks_cluster_name}:${repository_slug}" | sha256sum | cut -c1-16)"
          role_name="${service_name}-${role_hash}-gha"
          echo "AWS_REGION=$aws_region" >> "$GITHUB_ENV"
          echo "AWS_ACCOUNT_ID=$aws_account_id" >> "$GITHUB_ENV"
          echo "EKS_CLUSTER_NAME=$eks_cluster_name" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY_PREFIX=$ecr_repository_prefix" >> "$GITHUB_ENV"
          echo "SERVICE_NAME=$service_name" >> "$GITHUB_ENV"
          echo "K8S_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          echo "AWS_ROLE_ARN=arn:aws:iam::${aws_account_id}:role/${role_name}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 20

      - name: Configure EKS access
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Unable to configure EKS access after retrying."
          exit 1

      - name: Wait for Backstage provisioning
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 540); do
            if kubectl get configmap "${SERVICE_NAME}-deployment-ready" \
              --namespace "$K8S_NAMESPACE" >/dev/null 2>&1; then
              echo "Backstage provisioning is ready."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Backstage did not finish database provisioning within 45 minutes."
          exit 1

      - name: Create service ECR repository if needed
        shell: bash
        run: |
          set -euo pipefail
          repository_name="${ECR_REPOSITORY_PREFIX}/${SERVICE_NAME}"
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT

          if ! aws ecr describe-repositories --repository-names "$repository_name" >/dev/null 2>"$error_file"; then
            if grep -q "RepositoryNotFoundException" "$error_file"; then
              aws ecr create-repository \
                --repository-name "$repository_name" \
                --image-tag-mutability IMMUTABLE \
                --image-scanning-configuration scanOnPush=true \
                --encryption-configuration encryptionType=AES256
            else
              cat "$error_file" >&2
              exit 1
            fi
          fi

          aws ecr put-lifecycle-policy \
            --repository-name "$repository_name" \
            --lifecycle-policy-text '{"rules":[{"rulePriority":1,"description":"Retain the latest 30 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}'

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          repository_name="${ECR_REPOSITORY_PREFIX}/${SERVICE_NAME}"
          image_tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_uri="${{ steps.login-ecr.outputs.registry }}/${repository_name}:${image_tag}"
          docker build --tag "$image_uri" .
          docker push "$image_uri"
          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Deploy service
        shell: bash
        run: |
          set -euo pipefail
          sed "s|IMAGE_PLACEHOLDER|${IMAGE_URI}|g" k8s/deployment.yaml | kubectl apply --filename=-
          kubectl apply --filename=k8s/service.yaml
          kubectl rollout status "deployment/${SERVICE_NAME}" \
            --namespace "$K8S_NAMESPACE" \
            --timeout=5m
